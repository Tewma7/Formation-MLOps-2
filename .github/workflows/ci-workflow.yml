name: Python package
on:
  push:
  pull_request:
    branches: [ dev ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Install Ruff
        run: uv tool install ruff
      - name: Install Vulture
        run: uv tool install vulture
      - name: Install Bandit
        run: uv tool install bandit
      - name: Install Detect-secrets
        run: uv tool install detect-secrets
      - name: Lint code with Ruff (PEP8 + extended rules)
        run: ruff check --output-format=github --target-version=py39
      - name: Detect dead code with Vulture
        run: vulture formation_mlops_2 scripts --min-confidence=100 --ignore-decorators=@abstractmethod,@property --ignore-names=test_*,_*
      - name: Run security analysis with Bandit
        run: bandit -r . --severity-level medium --confidence-level high --skip B101,B301
      - name: Scan for secrets with detect-secrets
        run: detect-secrets scan --all-files --no-potential --exclude-files "tests/.*|.*\.min\.js|.*\.min\.css" .
      - name: Check code formatting with Ruff
        run: ruff format --diff --target-version=py39
        continue-on-error: true
      - name: Run tests
        run: uv run pytest tests

